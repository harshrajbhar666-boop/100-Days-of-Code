<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavach - Your Health Assistant</title>

    <!-- Tailwind CSS (Direct Link for Styling) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome (Icons ke liye) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tumhari Premium Custom CSS Animations -->
    <style>
        /* Mic button ke piche soft glowing wave animation */
        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
            }

            70% {
                box-shadow: 0 0 0 25px rgba(59, 130, 246, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
            }
        }

        .mic-glow {
            animation: pulse-glow 2s infinite;
        }

        /* Glassmorphism effect for cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body class="bg-slate-100 flex items-center justify-center min-h-screen font-sans">

    <!-- Mobile Screen Frame (Desktop par bhi phone jaisa dikhega) -->
    <div
        class="w-full max-w-md h-screen sm:h-[90vh] bg-slate-50 sm:rounded-3xl shadow-2xl sm:border-[8px] border-gray-800 relative overflow-hidden flex flex-col justify-between">

        <!-- 1. Top Header -->
        <header class="flex justify-between items-center p-5 z-10 bg-white shadow-sm">
            <div class="flex items-center gap-2">
                <span class="text-3xl">🛡️</span>
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-wide">KAVACH</h1>
            </div>
            <!-- Language Switcher -->
            <button
                class="bg-slate-100 border border-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-bold shadow-sm active:scale-95 transition-transform">
                A / अ
            </button>
        </header>

        <!-- 2. Main Center Area -->
        <main class="flex-1 flex flex-col items-center justify-center p-6 relative">

            <!-- AI Text / Wave Area -->
            <div class="h-20 mb-8 text-center w-full flex items-center justify-center px-4">
                <p class="text-lg font-medium text-slate-500" id="ai-text">
                    "Apni problem bolne ke liye mic dabayein..."
                </p>
            </div>

            <!-- Glowing Mic Button -->
            <button id="mic-btn"
                class="mic-glow bg-blue-500 hover:bg-blue-600 transition-colors w-36 h-36 rounded-full flex items-center justify-center text-white text-6xl shadow-[0_10px_25px_rgba(59,130,246,0.6)] z-10 active:scale-95">
                <i class="fa-solid fa-microphone"></i>
            </button>

            <!-- Camera / Scan Button -->
            <button id="camera-btn"
                class="mt-14 bg-white text-slate-700 px-6 py-4 rounded-2xl flex items-center gap-4 shadow-[0_8px_20px_rgba(0,0,0,0.06)] hover:shadow-[0_10px_25px_rgba(0,0,0,0.1)] transition-all font-semibold text-xl border border-slate-100 active:scale-95">
                <div class="bg-blue-100 p-2 rounded-full">
                    <i class="fa-solid fa-camera text-blue-600 text-xl"></i>
                </div>
                Report Photo Lein
            </button>
        </main>

        <!-- 3. Bottom Emergency SOS Area -->
        <footer class="p-5 pb-8 z-10 glass-card shadow-[0_-10px_20px_rgba(0,0,0,0.03)]">
            <button id="sos-btn"
                class="w-full bg-red-500 hover:bg-red-600 text-white font-bold text-xl py-5 rounded-2xl shadow-[0_10px_20px_rgba(239,68,68,0.4)] flex items-center justify-center gap-3 transition-transform active:scale-95">
                <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                AAPATKALIN (SOS)
            </button>
        </footer>

    </div>

</body>

</html>
